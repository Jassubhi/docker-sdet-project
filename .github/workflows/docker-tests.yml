name: Docker SDET Integration Tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  integration-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate Docker Compose
        run: docker compose config --quiet

      - name: Start API and PostgreSQL
        run: docker compose up -d --build db api

      - name: Run integration tests
        run: |
          mkdir -p reports
          docker compose run --rm --build \
            -v "$PWD/reports:/reports" \
            tests pytest -v -n 3 tests/test_integration.py \
            --junitxml=/reports/integration-results.xml \
            --html=/reports/integration-report.html \
            --self-contained-html

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-test-report
          path: reports/
          if-no-files-found: warn

      - name: Show container logs on failure
        if: failure()
        run: docker compose logs --tail=100 api db

      - name: Stop containers
        if: always()
        run: docker compose down -v
