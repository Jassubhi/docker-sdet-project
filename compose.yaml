services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: testuser
      POSTGRES_PASSWORD: testpass
      POSTGRES_DB: testdb
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U testuser -d testdb"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: ./app
    ports:
      - "8081:8000"
    environment:
      DB_HOST: db
      DB_NAME: testdb
      DB_USER: testuser
      DB_PASSWORD: testpass
    depends_on:
      db:
        condition: service_healthy
  
  tests:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      BASE_URL: http://api:8000
      DB_HOST: db
      DB_NAME: testdb
      DB_USER: testuser
      DB_PASSWORD: testpass
    depends_on:
      db:
        condition: service_healthy
      api:
        condition: service_started
    command: ["pytest", "-v", "tests/test_integration.py"]
